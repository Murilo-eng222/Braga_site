<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="pcbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2D1F" />
      <stop offset="100%" stop-color="#071911" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="#0A1420"/>
  <!-- PCB Green Board -->
  <rect x="30" y="30" width="340" height="240" rx="10" fill="url(#pcbBg)" stroke="#1B5238" stroke-width="2"/>
  
  <!-- Copper Traces / Routes -->
  <g stroke="#3ED07A" stroke-width="1.5" opacity="0.4" fill="none">
    <path d="M 50 50 L 100 50 L 130 80 L 200 80"/>
    <path d="M 50 90 L 120 90 L 150 120 L 150 180"/>
    <path d="M 350 70 L 280 70 L 250 100 L 250 200"/>
    <path d="M 300 230 L 220 230 L 180 190"/>
  </g>

  <!-- Microcontroller / IC Chips -->
  <rect x="150" y="90" width="80" height="80" rx="6" fill="#141E2B" stroke="#2C3D54" stroke-width="2"/>
  <circle cx="165" cy="105" r="3" fill="#3D7DFF"/>
  <text x="165" y="140" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7C8CA3">DSP-32</text>

  <!-- IC Pins -->
  <g fill="#A0B2C6">
    <rect x="142" y="100" width="8" height="4"/>
    <rect x="142" y="112" width="8" height="4"/>
    <rect x="142" y="124" width="8" height="4"/>
    <rect x="142" y="136" width="8" height="4"/>
    <rect x="142" y="148" width="8" height="4"/>

    <rect x="230" y="100" width="8" height="4"/>
    <rect x="230" y="112" width="8" height="4"/>
    <rect x="230" y="124" width="8" height="4"/>
    <rect x="230" y="136" width="8" height="4"/>
    <rect x="230" y="148" width="8" height="4"/>
  </g>

  <!-- Capacitors -->
  <circle cx="80" cy="80" r="16" fill="#2E4A70" stroke="#3D7DFF" stroke-width="2"/>
  <line x1="64" y1="80" x2="96" y2="80" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="80" cy="130" r="14" fill="#2E4A70" stroke="#3D7DFF" stroke-width="2"/>
  <circle cx="80" cy="180" r="18" fill="#2E4A70" stroke="#3D7DFF" stroke-width="2"/>

  <!-- Power Transistors / Heatsink -->
  <rect x="280" y="120" width="50" height="100" rx="4" fill="#1C2736" stroke="#FF7A1A" stroke-width="1.5"/>
  <circle cx="305" cy="140" r="4" fill="#FF7A1A"/>
  <rect x="295" y="160" width="20" height="50" fill="#4B5C73"/>
</svg>
