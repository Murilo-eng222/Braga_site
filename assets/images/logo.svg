<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D84FF" />
      <stop offset="100%" stop-color="#1B4DB0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A1A" />
      <stop offset="100%" stop-color="#FF9E4A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Logo Icon / Shield & Pulse -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="70" height="70" rx="18" fill="url(#logoGrad)" filter="url(#glow)"/>
    <!-- Circuit lines & B symbol -->
    <path d="M 22 20 L 40 20 C 48 20, 52 24, 52 30 C 52 35, 47 38, 41 38 C 49 38, 54 43, 54 50 C 54 57, 47 60, 38 60 L 22 60 Z" stroke="#FFFFFF" stroke-width="4.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 32 20 L 32 60" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 32 38 L 44 38" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="56" cy="18" r="4" fill="url(#accentGrad)" />
  </g>
  <!-- Text Brand -->
  <text x="96" y="44" font-family="'Manrope', 'Inter', sans-serif" font-weight="800" font-size="28" fill="#F5F8FC" letter-spacing="-0.02em">BRAGA</text>
  <text x="96" y="66" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11" fill="#7C8CA3" letter-spacing="0.18em">SERVIÇOS INDUSTRIAIS</text>
</svg>
