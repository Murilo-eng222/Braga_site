<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="sdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14243B" />
      <stop offset="100%" stop-color="#0A1420" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A5C75" />
      <stop offset="50%" stop-color="#7C8CA3" />
      <stop offset="100%" stop-color="#2D3D54" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#sdBg)" stroke="rgba(61,125,255,0.2)" stroke-width="2"/>
  <!-- Servo Drive Unit -->
  <rect x="40" y="40" width="140" height="220" rx="10" fill="#18283E" stroke="#2D4363" stroke-width="2"/>
  <rect x="55" y="60" width="110" height="40" rx="4" fill="#0A1420"/>
  <text x="65" y="85" font-family="'JetBrains Mono', monospace" font-size="16" fill="#3D7DFF" font-weight="700">POS: 180°</text>
  <!-- Connector Plugs -->
  <rect x="60" y="115" width="100" height="30" rx="4" fill="#0E1A2B" stroke="#3D7DFF"/>
  <rect x="60" y="155" width="100" height="30" rx="4" fill="#0E1A2B" stroke="#FF7A1A"/>
  <rect x="60" y="195" width="100" height="45" rx="4" fill="#0E1A2B" stroke="#3ED07A"/>
  <circle cx="75" cy="217" r="4" fill="#3ED07A"/>
  <circle cx="95" cy="217" r="4" fill="#3ED07A"/>

  <!-- Servomotor Assembly -->
  <rect x="220" y="90" width="120" height="130" rx="12" fill="url(#metalGrad)" stroke="#1A283C" stroke-width="2"/>
  <!-- Cooling Ribs -->
  <line x1="220" y1="110" x2="340" y2="110" stroke="#1A283C" stroke-width="3"/>
  <line x1="220" y1="130" x2="340" y2="130" stroke="#1A283C" stroke-width="3"/>
  <line x1="220" y1="150" x2="340" y2="130" stroke="#1A283C" stroke-width="3"/>
  <line x1="220" y1="170" x2="340" y2="170" stroke="#1A283C" stroke-width="3"/>
  <line x1="220" y1="190" x2="340" y2="190" stroke="#1A283C" stroke-width="3"/>

  <!-- Motor Shaft -->
  <rect x="340" y="135" width="35" height="40" fill="#99AABF" rx="2"/>
  <rect x="375" y="147" width="15" height="16" fill="#667890" rx="1"/>

  <!-- Cable Wire connection from Drive to Motor -->
  <path d="M 160 170 C 190 170, 190 155, 220 155" stroke="#FF7A1A" stroke-width="4" fill="none"/>
</svg>
