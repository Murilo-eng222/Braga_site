<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="invBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14243B" />
      <stop offset="100%" stop-color="#0A1420" />
    </linearGradient>
    <linearGradient id="displayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F281E" />
      <stop offset="100%" stop-color="#05140D" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#invBg)" stroke="rgba(61,125,255,0.2)" stroke-width="2"/>
  <!-- Heat Sink Fins -->
  <g fill="#1E324D" stroke="#0E1A2B" stroke-width="1">
    <rect x="50" y="30" width="12" height="240" rx="3"/>
    <rect x="70" y="30" width="12" height="240" rx="3"/>
    <rect x="90" y="30" width="12" height="240" rx="3"/>
  </g>
  <!-- Main Device Body -->
  <rect x="120" y="30" width="230" height="240" rx="12" fill="#182A45" stroke="rgba(255,255,255,0.1)"/>
  <!-- Control Panel / Display -->
  <rect x="145" y="55" width="180" height="70" rx="8" fill="url(#displayGrad)" stroke="#1F4D38"/>
  <text x="160" y="95" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#3ED07A">60.00 Hz</text>
  <text x="160" y="115" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7C8CA3">WEG CFW700 • RUN OK</text>
  <!-- Dial / Keypad -->
  <circle cx="185" cy="180" r="22" fill="#0E1A2B" stroke="#3D7DFF" stroke-width="2"/>
  <circle cx="185" cy="180" r="8" fill="#3D7DFF"/>
  <!-- Status LEDs -->
  <circle cx="240" cy="165" r="5" fill="#3ED07A"/>
  <circle cx="260" cy="165" r="5" fill="#FF7A1A"/>
  <circle cx="280" cy="165" r="5" fill="#7C8CA3"/>
  <!-- Buttons -->
  <rect x="235" y="190" width="30" height="18" rx="4" fill="#1FAA55"/>
  <rect x="275" y="190" width="30" height="18" rx="4" fill="#D93838"/>
  <!-- Terminal Block Bottom -->
  <rect x="145" y="235" width="180" height="25" rx="4" fill="#0A1420"/>
  <circle cx="165" cy="247" r="4" fill="#FF9E4A"/>
  <circle cx="195" cy="247" r="4" fill="#FF9E4A"/>
  <circle cx="225" cy="247" r="4" fill="#FF9E4A"/>
  <circle cx="255" cy="247" r="4" fill="#3D7DFF"/>
  <circle cx="285" cy="247" r="4" fill="#3D7DFF"/>
  <circle cx="305" cy="247" r="4" fill="#3ED07A"/>
</svg>
